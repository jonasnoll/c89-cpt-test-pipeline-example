# Configuration for the Testcontainers-based runtime started by @CamundaProcessTest.
# By default the runtime uses the same Camunda version as the camunda-process-test-java
# dependency in pom.xml; override here only if a specific image is needed.
#
# camundaDockerImageName=camunda/camunda
# camundaDockerImageVersion=8.9.0

# Reuse one runtime across all test classes instead of starting a fresh container per
# class. This is what keeps a local "mvn verify" and the CI run fast enough for a demo
# (still budget ~1-2 minutes for the first pull/start).
runtimeMode=shared

# Coverage report is written to target/coverage-report/report.html by default; kept
# implicit here so the path matches what the workflow uploads as an artifact.
